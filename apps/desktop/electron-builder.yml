# Installers for Windows, macOS and Linux (electron-builder).
# Asset names are stable so the website and README can link to them:
#   Protolens-<version>-windows-x64-setup.exe     Windows installer (NSIS)
#   Protolens-<version>-windows-x64-portable.exe  Windows portable (no install)
#   Protolens-<version>-macos-arm64.dmg            Apple Silicon
#   Protolens-<version>-macos-x64.dmg              Intel
#   Protolens-<version>-linux-x86_64.AppImage
#   Protolens-<version>-linux-amd64.deb
#   Protolens-<version>-linux-x86_64.rpm
appId: dev.nasimuddin.protolens
productName: Protolens
copyright: Copyright © 2026 Protolens contributors
electronVersion: 44.4.5
directories:
  output: release
  buildResources: build
# The main process bundles the whole engine (esbuild), so no node_modules are shipped.
files:
  - dist/**
  - dist-electron/**
  - "!dist-electron/*.map"
  - "!dist-electron/web-server.cjs"
  - package.json
asar: true
npmRebuild: false
# Auto-update source (electron-updater). Builds use --publish never; the release workflow uploads
# the installers plus latest.yml / latest-linux.yml and the .blockmap files to the GitHub Release.
publish:
  - provider: github
    owner: nasimuddin-dev
    repo: protolens
    releaseType: release
extraMetadata:
  main: dist-electron/main.cjs
  # package / executable name on Linux (.deb, .rpm, binary); the display name stays "Protolens"
  name: protolens

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Protolens
  artifactName: Protolens-${version}-windows-${arch}-setup.${ext}
portable:
  artifactName: Protolens-${version}-windows-${arch}-portable.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  icon: build/icon.png
  # Unsigned builds are ad-hoc signed so they run on Apple Silicon; notarization needs an Apple ID.
  identity: "-"
  hardenedRuntime: false
  artifactName: Protolens-${version}-macos-${arch}.${ext}
dmg:
  title: Protolens ${version}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  category: Development
  executableName: protolens
  icon: build/icon.png
  maintainer: Protolens contributors <noreply@github.com>
  synopsis: Test and debug REST, GraphQL, MCP and AI systems
  description: Local-first desktop app for testing, debugging and evaluating REST, GraphQL and WebSocket APIs, MCP servers, LLM APIs, RAG pipelines and AI agents.
appImage:
  artifactName: Protolens-${version}-linux-x86_64.${ext}
deb:
  artifactName: Protolens-${version}-linux-amd64.${ext}
rpm:
  artifactName: Protolens-${version}-linux-x86_64.${ext}
