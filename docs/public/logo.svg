<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- TestPion app icon: the name stacked ("Test" over "Pion") with the sparkle, for square icons (app, taskbar, installer, favicon) -->
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.25" r="1">
      <stop offset="0" stop-color="#172a6b"/>
      <stop offset="0.55" stop-color="#0c1440"/>
      <stop offset="1" stop-color="#070b26"/>
    </radialGradient>
    <linearGradient id="test" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#1ff0ff"/>
      <stop offset="0.45" stop-color="#1e88ff"/>
      <stop offset="0.8" stop-color="#8b5cff"/>
      <stop offset="1" stop-color="#f04fe0"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset="0.55" stop-color="#8b5cff"/>
      <stop offset="1" stop-color="#f04fe0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <g font-family="'Segoe UI Black', 'Arial Black', Arial, sans-serif" font-weight="900" font-size="330" letter-spacing="-8" text-anchor="middle">
    <text x="512" y="470" fill="url(#test)">Test</text>
    <text x="512" y="800" fill="#f4f6ff">Pion</text>
  </g>
  <path fill="url(#star)" d="M846 96 C 856 150 874 168 928 178 C 874 188 856 206 846 260 C 836 206 818 188 764 178 C 818 168 836 150 846 96 Z"/>
</svg>
